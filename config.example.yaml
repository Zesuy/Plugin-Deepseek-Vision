plugins:
  enabled: true
  configs:
    deepseek-vision:
      enabled: true
      priority: 100
      target_models:
        - deepseek-v4-flash

      # Reuse a vision model and credentials already configured in CLIProxyAPI
      # through the native host.model.execute callback.
      vision_model: gpt-5.6-luna

      language: zh
      request_timeout_seconds: 120
      max_images_per_request: 4
      max_request_bytes: 20971520
      max_image_reference_bytes: 15728640
      max_response_bytes: 4194304
      max_result_chars: 20000

      # Derived-text cache. Set size to 0 to disable.
      analysis_cache_size: 128
      analysis_cache_ttl_seconds: 900
      analysis_url_cache_ttl_seconds: 120

      # High-sensitivity debugging only. Writes complete plaintext request,
      # image references/data URIs, VLM payloads/results, and rewritten bodies to
      # logs/deepseek-vision-trace/. Credential headers remain redacted.
      trace_enabled: false
